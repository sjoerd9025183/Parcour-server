# Voorbeeldconfiguratie voor Render (Blueprint). Pas niets aan met geheimen: er zijn geen geheimen nodig.
services:
  - type: web
    name: parkour-rush-server
    runtime: node
    plan: free
    buildCommand: "echo no build step"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: TRUST_PROXY
        value: "1"
